name: Release macOS app

on:
  push:
    tags:
      - "agent-tooling-app-v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      default_branch_tip: ${{ steps.authorize.outputs.default_branch_tip }}
      release_commit: ${{ steps.authorize.outputs.release_commit }}
      release_tag_object: ${{ steps.authorize.outputs.release_tag_object }}
      release_version: ${{ steps.authorize.outputs.release_version }}

    steps:
      - name: Check out tag and branch history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require an authorized annotated tag on the default branch
        id: authorize
        env:
          ALLOWED_RELEASE_ACTORS: ${{ vars.MACOS_RELEASE_ALLOWED_ACTORS }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#agent-tooling-app-v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid app release tag: $GITHUB_REF_NAME" >&2
            exit 64
          fi
          if [[ -z "$DEFAULT_BRANCH" ]] || ! git check-ref-format --branch "$DEFAULT_BRANCH" >/dev/null; then
            echo "The repository default branch is missing or invalid" >&2
            exit 78
          fi
          if [[ -z "$ALLOWED_RELEASE_ACTORS" ]]; then
            echo "MACOS_RELEASE_ALLOWED_ACTORS must be a non-empty repository Actions variable" >&2
            exit 78
          fi

          actor_is_allowed() {
            local actor=${1,,}
            local candidate
            local -a configured_actors
            IFS=',' read -r -a configured_actors <<< "$ALLOWED_RELEASE_ACTORS"
            for candidate in "${configured_actors[@]}"; do
              candidate="${candidate#"${candidate%%[![:space:]]*}"}"
              candidate="${candidate%"${candidate##*[![:space:]]}"}"
              if [[ -n "$candidate" && "${candidate,,}" == "$actor" ]]; then
                return 0
              fi
            done
            return 1
          }

          for actor in "$RELEASE_ACTOR" "$TRIGGERING_ACTOR"; do
            if [[ -z "$actor" ]] || ! actor_is_allowed "$actor"; then
              echo "Release actor is not authorized by MACOS_RELEASE_ALLOWED_ACTORS" >&2
              exit 77
            fi
          done

          tag_ref="refs/tags/$GITHUB_REF_NAME"
          if [[ "$GITHUB_REF" != "$tag_ref" ]] || ! git show-ref --verify --quiet "$tag_ref"; then
            echo "The workflow must run from the pushed release tag" >&2
            exit 64
          fi
          if [[ "$(git cat-file -t "$tag_ref")" != "tag" ]]; then
            echo "Release tags must be annotated tag objects; lightweight tags are not authorized" >&2
            exit 77
          fi

          release_tag_object=$(git rev-parse "${tag_ref}^{tag}")
          release_commit=$(git rev-parse "${tag_ref}^{commit}")
          default_branch_ref="refs/remotes/origin/$DEFAULT_BRANCH"
          if ! git show-ref --verify --quiet "$default_branch_ref"; then
            echo "The fetched repository does not contain origin/$DEFAULT_BRANCH" >&2
            exit 78
          fi
          default_branch_tip=$(git rev-parse "${default_branch_ref}^{commit}")
          if ! git merge-base --is-ancestor "$release_commit" "$default_branch_tip"; then
            echo "Release commit $release_commit is not an ancestor of origin/$DEFAULT_BRANCH" >&2
            exit 77
          fi
          if [[ "$(git rev-parse "HEAD^{commit}")" != "$release_commit" ]]; then
            echo "The checked-out event commit does not match the release tag target" >&2
            exit 77
          fi

          {
            echo "release_version=$version"
            echo "release_tag_object=$release_tag_object"
            echo "release_commit=$release_commit"
            echo "default_branch_tip=$default_branch_tip"
          } >> "$GITHUB_OUTPUT"

  release:
    name: Sign, notarize, and publish
    needs: authorize
    runs-on: macos-26
    timeout-minutes: 45
    environment: macos-release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      RELEASE_VERSION: ${{ needs.authorize.outputs.release_version }}
      RELEASE_COMMIT: ${{ needs.authorize.outputs.release_commit }}
      RELEASE_TAG_OBJECT: ${{ needs.authorize.outputs.release_tag_object }}
      DMG_NAME: Agent-Tooling-${{ needs.authorize.outputs.release_version }}-arm64.dmg
      EXPECTED_SIGNING_TEAM_ID: 434X69L4Z5
    defaults:
      run:
        working-directory: apps/agent-tooling-macos

    steps:
      - name: Check out tagged source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.authorize.outputs.release_commit }}

      - name: Re-check the authorized release ref
        run: |
          tag_ref="refs/tags/$GITHUB_REF_NAME"
          test "$(git cat-file -t "$tag_ref")" = tag
          test "$(git rev-parse "${tag_ref}^{tag}")" = "$RELEASE_TAG_OBJECT"
          test "$(git rev-parse "${tag_ref}^{commit}")" = "$RELEASE_COMMIT"
          test "$(git rev-parse "HEAD^{commit}")" = "$RELEASE_COMMIT"

      - name: Require release credentials
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          for value in CERTIFICATE CERTIFICATE_PASSWORD NOTARY_KEY NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            if [[ -z "${!value}" ]]; then
              echo "Missing required GitHub Actions secret for $value" >&2
              exit 78
            fi
          done

      - name: Import Developer ID certificate
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/agent-tooling-signing.keychain-db"
          keychain_password=$(openssl rand -base64 32)

          printf '%s' "$CERTIFICATE" | base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain_path"
          security list-keychain -d user -s "$keychain_path"

          identity=$(security find-identity -v -p codesigning "$keychain_path" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)
          if [[ -z "$identity" ]]; then
            echo "The certificate does not contain a Developer ID Application identity" >&2
            exit 78
          fi
          echo "SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Prepare notarization key
        env:
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
        run: |
          printf '%s' "$NOTARY_KEY" | base64 -D > "$RUNNER_TEMP/notary-api-key.p8"
          chmod 600 "$RUNNER_TEMP/notary-api-key.p8"

      - name: Validate source and release scripts
        run: |
          swift format lint --strict -r Sources Tests Package.swift
          bash -n scripts/package-app.sh scripts/create-dmg.sh
          shellcheck_version=0.11.0
          shellcheck_archive="shellcheck-v${shellcheck_version}.darwin.aarch64.tar.xz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/$shellcheck_archive" \
            "https://github.com/koalaman/shellcheck/releases/download/v${shellcheck_version}/$shellcheck_archive"
          printf '%s  %s\n' \
            '56affdd8de5527894dca6dc3d7e0a99a873b0f004d7aabc30ae407d3f48b0a79' \
            "$RUNNER_TEMP/$shellcheck_archive" | shasum -a 256 --check
          tar -xJf "$RUNNER_TEMP/$shellcheck_archive" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/shellcheck-v${shellcheck_version}/shellcheck" -x scripts/package-app.sh scripts/create-dmg.sh
          plutil -lint Resources/Info.plist

      - name: Run tests and strict release build
        run: |
          swift test --disable-sandbox
          swift build --configuration release -Xswiftc -warnings-as-errors

      - name: Build and sign release app
        env:
          AGENT_TOOLING_CONFIGURATION: release
          AGENT_TOOLING_VERSION: ${{ env.RELEASE_VERSION }}
          AGENT_TOOLING_BUILD_NUMBER: ${{ github.run_number }}
          AGENT_TOOLING_CODE_SIGN_IDENTITY: ${{ env.SIGNING_IDENTITY }}
        run: ./scripts/package-app.sh "$RUNNER_TEMP/Agent Tooling.app"

      - name: Verify Developer ID signature
        run: |
          app="$RUNNER_TEMP/Agent Tooling.app"
          helper="$RUNNER_TEMP/Agent Tooling.app/Contents/Helpers/agent-tooling"
          mcp_helper="$RUNNER_TEMP/Agent Tooling.app/Contents/Helpers/agent-tooling-mcp"
          test -x "$helper"
          test -x "$mcp_helper"
          file "$helper"
          file "$mcp_helper"
          codesign --verify --strict --verbose=2 "$helper"
          codesign --verify --strict --verbose=2 "$mcp_helper"
          codesign --verify --deep --strict --verbose=2 "$app"
          developer_id_requirement='anchor apple generic and certificate 1[field.1.2.840.113635.100.6.2.6] exists and certificate leaf[field.1.2.840.113635.100.6.1.13] exists and certificate leaf[subject.OU] = "'"$EXPECTED_SIGNING_TEAM_ID"'"'
          codesign --verify --strict -R "=identifier \"com.arendalloul.agent-tooling\" and $developer_id_requirement" "$app"
          codesign --verify --strict -R "=identifier \"com.arendalloul.agent-tooling.cli\" and $developer_id_requirement" "$helper"
          codesign --verify --strict -R "=identifier \"com.arendalloul.agent-tooling.mcp\" and $developer_id_requirement" "$mcp_helper"
          codesign -dv --verbose=4 "$app" 2>&1 | tee "$RUNNER_TEMP/app-codesign-details.txt"
          codesign -dv --verbose=4 "$helper" 2>&1 | tee "$RUNNER_TEMP/helper-codesign-details.txt"
          codesign -dv --verbose=4 "$mcp_helper" 2>&1 | tee "$RUNNER_TEMP/mcp-helper-codesign-details.txt"
          grep -q "flags=.*runtime" "$RUNNER_TEMP/app-codesign-details.txt"
          grep -Fxq "Identifier=com.arendalloul.agent-tooling" "$RUNNER_TEMP/app-codesign-details.txt"
          grep -Fxq "Identifier=com.arendalloul.agent-tooling.cli" "$RUNNER_TEMP/helper-codesign-details.txt"
          grep -Fxq "Identifier=com.arendalloul.agent-tooling.mcp" "$RUNNER_TEMP/mcp-helper-codesign-details.txt"
          grep -Fxq "TeamIdentifier=$EXPECTED_SIGNING_TEAM_ID" "$RUNNER_TEMP/app-codesign-details.txt"
          grep -Fxq "TeamIdentifier=$EXPECTED_SIGNING_TEAM_ID" "$RUNNER_TEMP/helper-codesign-details.txt"
          grep -Fxq "TeamIdentifier=$EXPECTED_SIGNING_TEAM_ID" "$RUNNER_TEMP/mcp-helper-codesign-details.txt"
          app_authority=$(sed -n 's/^Authority=//p' "$RUNNER_TEMP/app-codesign-details.txt" | head -1)
          helper_authority=$(sed -n 's/^Authority=//p' "$RUNNER_TEMP/helper-codesign-details.txt" | head -1)
          mcp_helper_authority=$(sed -n 's/^Authority=//p' "$RUNNER_TEMP/mcp-helper-codesign-details.txt" | head -1)
          test -n "$app_authority"
          test "$app_authority" = "$helper_authority"
          test "$app_authority" = "$mcp_helper_authority"

      - name: Create signed disk image
        env:
          AGENT_TOOLING_CODE_SIGN_IDENTITY: ${{ env.SIGNING_IDENTITY }}
        run: ./scripts/create-dmg.sh "$RUNNER_TEMP/Agent Tooling.app" "$RUNNER_TEMP/$DMG_NAME"

      - name: Notarize and staple disk image
        env:
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          xcrun notarytool submit "$RUNNER_TEMP/$DMG_NAME" \
            --key "$RUNNER_TEMP/notary-api-key.p8" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --wait
          xcrun stapler staple "$RUNNER_TEMP/$DMG_NAME"
          xcrun stapler validate "$RUNNER_TEMP/$DMG_NAME"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$RUNNER_TEMP/$DMG_NAME"

      - name: Create checksum and release notes
        run: |
          cd "$RUNNER_TEMP"
          shasum -a 256 "$DMG_NAME" > "$DMG_NAME.sha256"
          cd "$GITHUB_WORKSPACE/apps/agent-tooling-macos"
          python3 scripts/generate-sbom.py \
            "$RELEASE_VERSION" \
            "$RUNNER_TEMP/$DMG_NAME.spdx.json" \
            "$RELEASE_COMMIT"
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          ## Agent Tooling $RELEASE_VERSION

          Native macOS control center for Codex, Claude Code, and Gemini CLI tooling.

          Source commit: \`$RELEASE_COMMIT\`

          Annotated tag object: \`$RELEASE_TAG_OBJECT\`

          **Requirements:** Apple Silicon Mac running macOS 26 or newer.

          Download the DMG, open it, and drag **Agent Tooling** into **Applications**. The app is Developer ID signed and notarized by Apple.
          EOF

      - name: Attest release provenance
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: ${{ runner.temp }}/${{ env.DMG_NAME }}

      - name: Attest release SBOM
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: ${{ runner.temp }}/${{ env.DMG_NAME }}
          sbom-path: ${{ runner.temp }}/${{ env.DMG_NAME }}.spdx.json

      - name: Upload notarized release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Agent-Tooling-${{ env.RELEASE_VERSION }}-macOS-arm64
          path: |
            ${{ runner.temp }}/${{ env.DMG_NAME }}
            ${{ runner.temp }}/${{ env.DMG_NAME }}.sha256
            ${{ runner.temp }}/${{ env.DMG_NAME }}.spdx.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/$DMG_NAME" \
            "$RUNNER_TEMP/$DMG_NAME.sha256" \
            "$RUNNER_TEMP/$DMG_NAME.spdx.json" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Agent Tooling $RELEASE_VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Remove temporary keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/agent-tooling-signing.keychain-db" 2>/dev/null || true
